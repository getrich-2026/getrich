site_name: GetRich — 量化投研与信号平台
site_description: 零售级量化信号与回测平台的官方技术文档（核心引擎 / Web API / Worker 池 / systemd 部署）
site_author: GetRich 团队
site_url: https://getrich.github.io/getrich/

# Round #1149: SEO meta + social cards. The site already had
# site_description / site_author (line 2-3), but no explicit
# keywords, no language tag for crawlers, no Open Graph / Twitter
# card fallback. Adding them gives the public gh-pages index a
# proper snippet in Chinese / English search results, and makes
# shared links show a description preview instead of an empty card.
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

extra:
  # Search-engine keywords (comma-separated, both CN + EN).
  keywords:
    - 量化回测
    - quant backtest
    - Polars
    - ClickHouse
    - PostgreSQL
    - 因子
    - alpha
    - 回测引擎
    - signal platform
    - 投研平台
  # Social card: og:image / twitter:image. The file is generated
  # by the docs CI from a template; until it's committed we let
  # the Material theme render a default Material logo.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/getrich/getrich
      name: GetRich on GitHub
    - icon: fontawesome/solid/globe
      link: https://getrich.github.io/getrich/
      name: Documentation site
  # Alternate language tag for the HTML <html lang="..."> attribute.
  # material.theme.language already sets `zh`; this stays in sync.
  alt_name: GetRich Documentation

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - palette.toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/css/extra.css

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - include-markdown:
      preserve_includer_indent: false
      dedent: true
      trailing_newlines: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            # Round #1146: show_source: false globally. The
            # previous default of true inlined the full source
            # of every public class/function in the rendered HTML,
            # which made ``docs/engine/api-reference/index.html``
            # ~4.7MB and the full mkdocs site ~13MB. Users who
            # need the source can click the [View Source] link
            # (Material theme generates one from
            # ``show_source: true`` per-directive if needed; we
            # also enable it for the "top entry points" in
            # engine/api-reference.md §1 for quick look-up).
            # Default stays OFF — the per-symbol pages are
            # 5-10x smaller, scroll much faster on mobile, and
            # search engines index more of the actual docstring
            # content (the inlined source was stealing relevance
            # from the rendered parameter docs).
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            docstring_section_style: table
            heading_level: 2
            filters: ["!^_"]
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      check_paths: true
      restrict_base_path: true
  - pymdownx.striphtml
  - pymdownx.magiclink

