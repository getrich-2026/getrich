[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getrich"
version = "0.1.2"
description = "量化投研系统 - 模块化设计的多品种投研交易平台"
readme = "README.md"
authors = [{ name = "GetRich Team", email = "linnan@nebulastar.com.cn" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "quantitative trading",
    "futures",
    "options",
    "financial",
    "trading system",
]

# 项目依赖
dependencies = [
    "akshare",
    "clickhouse-connect",
    "dotenv",
    "lntools",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "py_vollib",
    "pyyaml",
    "python-dateutil",
    "rich",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "tqdm",
    "rqdatac",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ipython>=8.0.0",
]


[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["getrich*"]
exclude = ["tests*", "reference*", "docs*"]

[tool.setuptools.package-data]
"getrich.config" = ["*.yml"]
"getrich.apps.data.table" = ["*.sql"]

[tool.ruff]
# 目标 Python 版本
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 启用规则集合：
# E/F: 标准错误 (Flake8)
# I: 自动导入排序 (Isort) - 极其重要
# B: 潜在 Bug (Bugbear)
# SIM: 代码简化 (Simplify) - 提升执行效率
# NPY: NumPy 专项规则 - 防止数值计算错误
# UP: 语法现代化 (Pyupgrade) - 保持代码使用最新特性
# PL: Pylint 部分规则 (可选，较严格)
select = ["E", "F", "I", "B", "SIM", "NPY", "UP"]

# 忽略规则：
# E501: 行长过长 (交给 Formatter 自动处理，Linter 不报错)
ignore = ["E501"]

[tool.ruff.lint.isort]
# 将这些库识别为“第三方库”，确保 import 排序正确
known-third-party = ["numpy", "pandas", "polars", "numba", "duckdb", "clickhouse_connect"]

[tool.ruff.lint.per-file-ignores]
# 在 Notebook 中忽略某些规则 (如未使用的导入)
"*.ipynb" = ["E402", "F401"]
# 在 __init__.py 中允许未使用的导入 (通常用于暴露 API)
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
# 测试配置
minversion = "7.0"
# 自动发现测试文件
testpaths = ["tests"]
# 默认参数：
# -v: 详细输出
# -ra: 显示跳过/失败的原因
# --durations=10: 列出最慢的 10 个测试 (用于性能优化)
addopts = "-v -ra --durations=10"
# 过滤器：将特定警告视为错误 (严格模式)
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
typeCheckingMode = "strict"
# 允许导入没有类型存根 (.pyi) 的第三方库 (如 tushare, CTP 接口)
# 如果不加这行，导入这些库时 import 语句会报错
reportMissingTypeStubs = false

# 忽略因为库定义缺失导致的 "Unknown" 类型
# 解决 Pandas/Polars/Numpy 链式调用产生大量 Unknown 的问题
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownLambdaType = false

# 允许我写 "多余" 的 isinstance 检查
# 在实盘中，我不信任上游数据，即使 Type Hint 说它是 int，我也要 check 它是 int
reportUnnecessaryIsInstance = false

# 排除目录
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/.github",
    "**/.vscode",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true   # 强制要求所有函数必须写类型，适合严谨的交易逻辑
check_untyped_defs = true
ignore_missing_imports = false # 先关闭全局忽略，改为针对性忽略以保留其它库的检查

[[tool.mypy.overrides]]
module = ["lntools.*", "akshare", "py_vollib.*", "rqdatac"]
ignore_missing_imports = true
