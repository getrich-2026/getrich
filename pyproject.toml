[project]
name = "getrich-data"
version = "0.1.0"
description = "GetRich 平台外部数据接入层：下载（raw）→ 归一化入库（ingest）→ PostgreSQL/TimescaleDB；含实时（stream）与库管理（db）。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "psycopg[binary,pool]>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
getrich = "getrich_data.cli:main"

[project.optional-dependencies]
# 供应商 SDK 不在 PyPI / 需凭证与专用 wheel，按需手动安装；此处仅占位说明。
# ricequant: rqdatac    yinhe: AmazingData    insight: insight_python
# tushare 在 PyPI 上有发布，但仅 raw 层运行时需要，故同样按需安装：pip install tushare
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getrich_data"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_sdk: 需要真实供应商 SDK 与凭证，默认 skip",
    "integration: 需要可用的 PostgreSQL（docker），不可用时 skip",
]
