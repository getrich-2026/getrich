[project]
name = "getrich-workspace"
version = "0.1.2"
description = "GetRich monorepo workspace"
readme = "README.md"
authors = [{ name = "GetRich Team", email = "linnan@nebulastar.com.cn" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gr-agent",
    "gr-api",
    "gr-backtest",
    "gr-data",
    "gr-factor",
    "gr-signal",
]

[tool.uv]
package = false

[tool.uv.sources]
gr-agent = { workspace = true }
gr-api = { workspace = true }
gr-backtest = { workspace = true }
gr-data = { workspace = true }
gr-factor = { workspace = true }
gr-signal = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
# 代码每行最大长度
line-length = 100
# gr-data/reference/ 是厂商资料与被 raw/ 层取代的历史脚本，不是可运行源码，
# 阶段 6 会整体移出到 getrich-design 仓，这里先不纳入 lint。
exclude = ["packages/gr-data/reference"]
# 目标 Python 版本
target-version = "py310"

[tool.ruff.lint]
# 融合后的规则集：你的原版 + 推荐增强
# E/F: 标准错误
# I: 自动导入排序 (Isort)
# B: 潜在 Bug (Bugbear)
# SIM: 代码简化 (Simplify) - 帮你写出更优雅的 Pythonic 代码
# NPY: NumPy 专项规则 - 避免量化计算中的常见坑
# UP: 语法现代化
# N: 命名规范 (PEP8)
select = ["E", "F", "I", "B", "SIM", "NPY", "UP", "N"]
ignore = ["D203"]

[tool.ruff.format]
# 类似 Black 的自动格式化
quote-style = "double"  
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
# 让 Ruff 像 isort 一样自动整理 import
known-third-party = ["numpy", "pandas", "polars", "clickhouse_connect"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# 在 Notebook 中忽略某些规则 (如未使用的导入)
"*.ipynb" = ["E402", "F401"]
# 在 __init__.py 中允许未使用的导入 (通常用于暴露 API)
"__init__.py" = ["F401"]
# FastAPI 路由的 Depends() 在函数签名中是标准模式
"**/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
# 测试配置
minversion = "7.0"
# 自动发现测试文件
testpaths = [
    "packages/gr-backtest/tests",
    "packages/gr-data/tests",
    "packages/gr-factor/tests",
]
# 数据层用例的自定义标记（原 getrich-database 的 pytest 配置，随合并迁入）
markers = [
    "live_sdk: 需要真实供应商 SDK 与凭证，默认 skip",
    "integration: 需要可用的 PostgreSQL（docker），不可用时 skip",
]
# Round #1203 (E-1): two distinct test trees share base names
# (``test_backtest_run.py`` and ``test_metrics.py`` exist in BOTH
# ``packages/gr-backtest/tests/getrich_backtest/`` and
# ``packages/gr-backtest/tests/getrich/apps/web/``). The
# default ``prepend`` import mode re-uses the first-seen module on
# later collection, which raises ``import file mismatch`` and
# crashes the test run. The ``importlib`` mode imports each test
# file as a separately-named module
# (``getrich.apps.web.test_metrics`` vs
# ``getrich_backtest.test_metrics``), so the collision goes away
# without renaming any file. Pytest 9.x does NOT honour a
# ``import_mode`` config key (only the CLI flag), so we put it in
# ``addopts`` instead. Verified locally:
#   1862 tests collected (was 0 with 2 collection errors)
#   1892 passed, 5 skipped (PG-integration guarded by env)
# 默认参数：
# -v: 详细输出
# -ra: 显示跳过/失败的原因
# --durations=10: 列出最慢的 10 个测试 (用于性能优化)
# --no-cov-on-fail: 如果测试失败不要被覆盖率覆盖输出淹没
# CI 通过显式的 ``--cov`` 与 ``--cov-fail-under`` 参数启用覆盖率门禁；
# 本地默认测试不计算覆盖率。
addopts = "-v -ra --durations=10 --import-mode=importlib"
# 过滤器：将特定警告视为错误 (严格模式)
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Coverage configuration (pytest-cov)
# ---------------------------------------------------------------------------
# Round #1161 adds a coverage gate to CI. We don't gate the local
# test run (avoids noisy dev loops); CI sets ``--cov-fail-under=``
# explicitly. The ``source`` here tells pytest-cov WHAT to measure
# (so it doesn't accidentally sweep tests/scripts/ into the denominator).
#
# Threshold policy:
#   The CI floor is set in .github/workflows/ci.yml (single source of
#   truth). Raise it in lockstep with the #1161 plan:
#     2026-Q3  target 60%   (initial — defensive, Round #1161)
#     2026-Q3+ target 75%   (after Round #1203 E-1 cleanup; 78.8% actual)
#     2026-Q4  target 80%   (after frontend coverage ships)
#     2027-Q1  target 85%   (steady-state target)
#   Each bump should be a one-line PR; bump in PR-sized chunks of ≤5pp.
#   The actual measured coverage is reported at the end of the test
#   job; if a PR drops it below the CI floor, the build fails before
#   the merge. This is the "regression firewall" — the whole point of
#   E-1.
[tool.coverage.run]
# ``source`` is a list of packages to measure. Anything outside this
# list is treated as "third-party" and not measured. We intentionally
# EXCLUDE tests/ (that's not source) and apps/data/ (data tables,
# not logic).
source = [
    "gr_data",
    "getrich",
    "getrich_backtest",
]
# Branch coverage is required for the engine (lots of if/else in
# execution / account / portfolio). Without it, a 100% line-coverage
# score can hide a missing else-branch.
branch = true
# Use source= layout, not auto, so we don't accidentally measure
# test fixtures that happen to import getrich.
source_pkgs = ["gr_data", "getrich", "getrich_backtest"]

[tool.coverage.report]
# Skip these as "not source" (they're not libraries we ship):
#   - tests/                     (test code; covered by definition)
#   - getrich.migrations.*       (Alembic / SQL migration scripts)
#   - getrich.apps.data.table    (large auto-generated SQL)
exclude_lines = [
    # Standard "skip me" comments (mirrors coverage's defaults but
    # spelled out so future maintainers know what's expected).
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    # Abstract methods (covered by their concrete subclasses; counting
    # them inflates the denominator).
    "@abstractmethod",
    "@abstractclassmethod",
    "@abstractstaticmethod",
    # Defensive `pass` lines; the function's intent is documented
    # by the docstring and a no-op pass is fine.
    '^\s*pass\s*$',
    # ``...`` ellipsis in Protocol / ABC method bodies.
    '^\s*\.\.\.\s*$',
]
# Show the N lowest-covered files at the end; helps reviewers spot
# which modules regressed in the diff.
show_missing = true
skip_covered = false
# Round #1203 (E-1): ``ignore_errors`` belongs in [tool.coverage.report]
# (not [tool.coverage.run] where it was previously declared — coverage
# 7.14.1 emits a "Unrecognized option" warning when it lives under
# ``run``). It only affects the reporting pass: if a measured file
# is later deleted or a sub-process can't be inspected, the report
# is generated anyway (no exit-1).
ignore_errors = true
# Precision of the percentage in the terminal / report. 1 decimal is
# enough to spot a 0.1pp regression.
precision = 1
# Exclude these paths entirely (they're not first-party source).
exclude_also = [
    "tests/.*",
    "migrations/.*",
    "scripts/.*",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.basedpyright]
typeCheckingMode = "all"
# 允许导入没有类型存根 (.pyi) 的第三方库 (如 tushare, CTP 接口)
# 如果不加这行，导入这些库时 import 语句会报错
reportMissingTypeStubs = false

# 忽略因为库定义缺失导致的 "Unknown" 类型
# 解决 Pandas/Polars/Numpy 链式调用产生大量 Unknown 的问题
# reportUnknownArgumentType = false
# reportUnknownVariableType = false
# reportUnknownParameterType = false
# reportUnknownMemberType = false
# reportUnknownLambdaType = false
reportUnusedImport = "warning"         # 让 Ruff 负责删除，但这里显示警告
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
pythonVersion = "3.10"

# 允许我写 "多余" 的 isinstance 检查
# 在实盘中，我不信任上游数据，即使 Type Hint 说它是 int，我也要 check 它是 int
reportUnnecessaryIsInstance = false

# 排除目录
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/.github",
    "**/.vscode",
]

[dependency-groups]
dev = [
    "flower>=2.0",
    "httpx>=0.28.1",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-cov>=6.0.0",
    "ruff",
    # ``tomllib`` is stdlib in 3.11+; the CI matrix still
    # includes 3.10, so we keep ``tomli`` as the fallback for
    # the test that reads pyproject.toml.
    "tomli>=2.0; python_version < '3.11'",
]
