database_url = "postgresql+psycopg://getrich:getrich@127.0.0.1:5432/getrich"
provider = "yinhe"
timezone = "Asia/Shanghai"
batch_rows = 50000

[yinhe]
data_dir = "/data"

[insight]
# Optional. These paths are added to sys.path before importing insight runtime.
runtime_paths = []
# Optional dotenv-style file. Values are loaded into env only when the env var is absent.
env_file = ""
staging_dir = "~/data/insight"
username_env = "INSIGHT_USER"
password_env = "INSIGHT_PASSWORD"
login_required = true
batch_size = 300
default_start_date = ""
default_end_date = ""
symbols = []

[ricequant]
staging_dir = "~/data/ricequant"
env_file = "../.env"
license_env = "RQDATAC_LICENSE"
init_mode = "tcp_license"
username_env = "RQDATAC_USER"
password_env = "RQDATAC_PASSWORD"
login_required = true
market = "cn"
batch_size = 300
default_start_date = "2026-05-19"
default_end_date = "2026-05-19"
symbols = ["000001.XSHE", "IF2406"]

[parquet]
export_dir = "/data/parquet/getrich"

[quality]
fail_on_error = true
price_jump_warn_pct = 0.2
expected_minutes_per_day = ""
