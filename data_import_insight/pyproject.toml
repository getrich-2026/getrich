[project]
name = "getrich-data-import"
version = "0.1.0"
description = "GetRich database ingestion layer built around the v1 database design"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=12.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "tomli>=2.0; python_version < '3.11'",
    "insight-py-linux>=6.1.2",
    "polars>=1.41.2",
    "rqdatac>=3.5.2",
]

[project.scripts]
getrich-import = "getrich_data_import.cli:main"

[tool.uv]
managed = true
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
