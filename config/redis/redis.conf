# Redis 配置定义（仓库内为可复现定义，部署实例按需覆盖）
# 容量 maxmemory 由 compose 从 REDIS_MAXMEMORY 传入，不写死在这里

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 关闭 RDB 快照：已有 AOF，双写只是多余 IO
save ""

# 日志配置
loglevel notice
logfile /var/log/redis/redis.log

# 慢查询日志（超过 10ms 记录）
slowlog-log-slower-than 10000
slowlog-max-len 128

# 内存管理
#
# noeviction：内存写满时写入直接报错，绝不静默淘汰 key。
#
# 本实例混放了 tick 缓存、跨进程状态、分布式锁和限流计数器。allkeys-lru 之类的
# 淘汰策略不区分 key 用途，内存压力下会连分布式锁一起淘汰 —— 锁凭空消失会让两个
# 进程同时进临界区，导致重复下单或重复写账户快照。金融路径上「写失败并报错」远好过
# 「锁没了但没人知道」。缓存类 key 靠自身 TTL 回收，不依赖淘汰。
#
# 后续若要改回 LRU，必须先把锁和限流隔离到独立 db 或独立实例。见 DECISIONS.md D-013。
maxmemory-policy noeviction

# 安全配置
# requirepass 由 compose 通过命令行传入（见 docker-compose.yml 的 redis.command）
protected-mode yes
