# PostgreSQL 配置定义（TimescaleDB 镜像）
#
# 通过 `postgres -c config_file=...` 加载。第一行先 include 回 $PGDATA/postgresql.conf，
# 保留镜像内 timescaledb-tune 按本机规格算出的内存与并行度调优；其后的设置覆盖它，
# 只管**与机器规格无关**的部分（时区、日志、WAL、planner、事务）。
#
# PostgreSQL 后读到的设置胜出，所以 include 必须放在最前面。
#
# 仓库内为可复现定义；部署实例如需固定内存参数，在文件末尾追加即可（见「内存」一节）。

# ---------- 路径 ----------
# config_file 位于 $PGDATA 之外时，下面三项必须显式指定，否则 PostgreSQL 无法推断
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# ---------- 继承 timescaledb-tune 的调优 ----------
# 提供 shared_buffers / effective_cache_size / work_mem / maintenance_work_mem /
# max_worker_processes / max_parallel_workers 等按本机内存核数算出的值，
# 以及 shared_preload_libraries = 'timescaledb'
include_if_exists = '/var/lib/postgresql/data/postgresql.conf'

# ---------- 以下覆盖 include 的内容 ----------

# ---------- 连接 ----------
listen_addresses = '*'
port = 5432

# ---------- 扩展 ----------
# 兜底：include 缺失时仍保证 TimescaleDB 加载
shared_preload_libraries = 'timescaledb'
timescaledb.telemetry_level = off

# ---------- 时区与本地化（平台铁律：Asia/Shanghai）----------
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
# 日志消息保持英文以便 grep；C locale 在任何基础镜像上恒定可用
lc_messages = 'C'

# ---------- WAL 与 checkpoint ----------
wal_level = replica
wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# ---------- 查询规划（SSD）----------
random_page_cost = 1.1

# ---------- 日志 ----------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
# 记录慢查询（超过 1s）
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
# 记录所有落盘的临时文件，便于发现 work_mem 不足
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---------- 事务 ----------
# 悬挂事务会一直持锁并阻塞 vacuum，10 分钟后强制中断
idle_in_transaction_session_timeout = 10min

# ---------- 内存 ----------
# 默认交给 timescaledb-tune（见上方 include），不在这里写死 —— 手写的保守值会覆盖掉
# 按本机规格算出的调优，导致 shared_buffers 等参数不升反降。
#
# 需要固定时在此处追加，例如：
#   shared_buffers = 1GB
#   effective_cache_size = 3GB
#   work_mem = 16MB
#   maintenance_work_mem = 512MB
#   max_connections = 100
