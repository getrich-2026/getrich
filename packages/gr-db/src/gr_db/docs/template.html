<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GetRich 数据字典</title><style>
:root{color-scheme:light dark;--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#59636e;--line:#d0d7de;--error:#b42318;--warn:#b54708}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--error:#ff7b72;--warn:#d29922}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{padding:24px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);z-index:2}input{width:min(540px,100%);padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;max-width:1500px;margin:auto;padding:24px}nav{position:sticky;top:118px;height:max-content}nav a{display:block;padding:4px 0;color:var(--muted);text-decoration:none}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);padding:8px;border-radius:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}.meta{color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:7px;border-top:1px solid var(--line);vertical-align:top}.error{color:var(--error)}.warn{color:var(--warn)}code{font-family:ui-monospace,monospace}@media(max-width:800px){.layout{display:block}nav{display:none}}
</style></head><body>$content<script>document.querySelector('#search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('[data-search]').forEach(x=>x.hidden=!x.dataset.search.includes(q))})</script></body></html>
