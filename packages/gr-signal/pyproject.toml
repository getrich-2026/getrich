[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-signal"
version = "0.1.2"
description = "GetRich 实盘信号生产与交易执行：broker、实盘 runner、风控、调度与信号/成交落库"
requires-python = ">=3.10"
dependencies = [
    "gr-backtest",
    "gr-data",
    "polars",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
]

[project.scripts]
gr-signal = "gr_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gr_signal*"]
