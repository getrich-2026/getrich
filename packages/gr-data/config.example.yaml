# GetRich 数据接入层配置样例
# 复制为 config.yaml 并填入真实值（config.yaml 已被 .gitignore 忽略）。
#
# 这里只放**结构化的采集参数**：抓取范围、限频、启用哪些 fetcher/importer。
# 数据库连接与日志配置统一在仓库根的 .env（PG_HOST / PG_PASSWORD / LOG_LEVEL …），
# 不要在这里再写一份 —— 两份配置用的还是不同的环境变量名（PGHOST vs PG_HOST），
# 会让 CLI 和应用连到不同的库上。
# 凭证一律只写「环境变量名」，不写明文密钥。

# ---- 全局 ----
paths:
  # raw 层 parquet 落地根目录（仓库外）。
  raw_root: /opt/raw_parquet

# ---- 数据源 ----
providers:
  yinhe:
    # 银河 AmazingData，凭证从环境变量读取
    username_env: YINHE_USER
    password_env: YINHE_PASSWORD
    host: ${YINHE_HOST}
    port: 8600
    rate_limit:
      sleep_between_requests_sec: 1.5
      max_retries: 5
      retry_backoff_base_sec: 3.0
      sleep_between_fetchers_sec: 5.0
    start_date: null            # 可选全局下限，int8，如 20130101

  ricequant:
    # 变量名与 settings.py 的 RiceQuantConfig 保持一致；
    # 曾经这里写 RQ_LICENSE 而 settings 读 RICEQUANT_API_KEY，两套名字
    # 导致采集层拿不到 license，rqdatac.init() 静默退化成无凭证初始化。
    license_env: RICEQUANT_API_KEY   # 或改用 username_env/password_env
    username_env: null
    password_env: null
    market: cn
    connect_timeout: 5
    timeout: 60
    # 风险五件套独立任务：--only rq_risk_model。真实核对后才能填写单位并启用。
    # 仅支持标准沪深模型、daily horizon；不会自动继承 DataYes 的 factor.* 归属。
    risk_model:
      selected: false
      permission_confirmed: false
      model: null                  # v1 / v2 / v2trd；按已购买模型填写
      industry_mapping: null       # sws_2021 / citics_2019
      start_date: null             # YYYY-MM-DD，必须是已结束的日期
      end_date: null
      order_book_ids: []           # 显式股票范围，例如 000001.XSHE；最多 10000 只
      batch_size: 200
      units_evidence: null         # 官方说明或账户样本复核记录的引用
      source_units:                # 不提供猜测默认值；specific_risk 是标准差 σ
        factor_return: null       # dec_daily / pct_daily
        specific_return: null     # dec_daily / pct_daily
        covariance: null          # dec2_daily / pct2_daily / dec2_annual / pct2_annual
        specific_risk: null       # dec_daily / pct_daily / dec_annual / pct_annual
    # 特色指数补充任务默认关闭，不追加到下方旧任务的 enabled 集合。
    # 仅在逐数据集完成两源去重、权限和样本验证后填写证据、日期并选定。
    # 正式 raw 另需环境变量 RICEQUANT_ENABLED=true；ingest writer 尚未开放。
    supplements:
      quota_reserve_fraction: 0.1
      datasets:
        rq_index_daily:
          selected: false
          contract_version: v1
          start_date: null
          end_date: null
          index_codes: [866001.RI, 866002.RI, 866006.RI, 866007.RI]
          fields: [open, high, low, close, prev_close, volume, total_turnover]
          enable_bjse: false
          replay_trading_days: 5
          max_symbols_per_request: 10
          max_pending_bytes: 67108864
          evidence:
            tushare_overlap: unknown
            datayes_overlap: unknown
            rq_permission: unknown
            contract_status: unknown
            checked_on: null
            references: []
        rq_index_components:
          selected: false
          contract_version: v1
          start_date: null
          end_date: null
          index_codes: [866001.RI, 866002.RI, 866006.RI, 866007.RI]
          # 必须用样本核对是否需北交所成员；SDK 默认 False 会过滤北交所。
          enable_bjse: false
          evidence:
            tushare_overlap: unknown
            datayes_overlap: unknown
            rq_permission: unknown
            contract_status: unknown
            checked_on: null
            references: []
        rq_index_weights:
          selected: false
          contract_version: v1
          start_date: null
          end_date: null
          index_codes: [866001.RI, 866002.RI, 866006.RI, 866007.RI]
          enable_bjse: false
          evidence:
            tushare_overlap: unknown
            datayes_overlap: unknown
            rq_permission: unknown
            contract_status: unknown
            checked_on: null
            references: []
        # 以下仅登记条件候选；选定会明确报错，尚无采集或入库实现。
        option_greeks_1d: {selected: false}
        option_indicators_1d: {selected: false}
        future_dividend_points: {selected: false}
        margin_haircut: {selected: false}
        equity_incentive: {selected: false}
        risk_descriptor_exposure: {selected: false}
        risk_stock_beta: {selected: false}

  insight:
    username_env: INSIGHT_USER
    password_env: INSIGHT_PASSWORD

  tushare:
    token_env: TUSHARE_TOKEN
    rate_limit:
      # Tushare 按积分分级限频，超限直接抛异常。1.5s 对应约 40 次/分钟，
      # 低积分账号需调大。
      sleep_between_requests_sec: 1.5
      max_retries: 5
      retry_backoff_base_sec: 3.0
    start_date: 20130101        # 全量起点，int8

  datayes:
    # 通联数据（CNE6-SW21 风险模型五表）。无官方 pip SDK，走自研 HTTP client。
    token_env: DATAYES_TOKEN
    base_url: https://api.wmcloud.com/data/v1
    rate_limit:
      # 官方未公布限流阈值，只给了 -11/-15/-16 三个错误码。初值取保守的 1 req/s，
      # 跑通一次全量后按实际回调。-16（调取过频）会让 client 就地把它上调 1.5 倍。
      sleep_between_requests_sec: 1.0
      max_retries: 5
      retry_backoff_base_sec: 3.0
    start_date: 20250101        # 本轮导入区间起点，回补历史时调这里
    scaling:
      # ⚠️ 量纲声明**没有默认值**：缺任何一个键，ingest 直接拒绝启动。
      # 原因是同一个模型内部量纲是混着的（实测，见 getrich-design
      # data-platform/providers/datayes.md §9.0）：f 是小数、u/SRISK/F 是百分比制，
      # 于是 r = 100·X·f + u。少乘那个 100 差两个数量级，把 SRISK 当方差差一个数量级，
      # 两种错都不会报错。给默认值等于「漏配就按猜的系数算」。
      mode: calibrated          # calibrated | passthrough
      exposure_unit: zscore     # 风格因子无量纲 z-score；行业因子是 0/1 哑变量
      factor_ret_unit: dec_daily
      cov_unit: pct2_annual
      srisk_unit: pct_annual
      srisk_is_variance: false  # 供应商给的是波动率 σ，入库前平方成方差
      spret_unit: pct_daily
      calibrated: false         # 全区间复核通过前保持 false，下游据此标 degraded

# ---- 抓取/入库开关（哪些 fetcher / importer 启用）----
# 详见 docs/layers/*.md
enabled:
  raw:
    yinhe: [calendar, hist_code_list, backward_factor, kline_day, kline_min1]
    ricequant: [instruments, calendar, bars_1d]
    insight: [basic_info, trading_days, kline_day]
    # 顺序有依赖：calendar 必须排在逐日接口之前（它们靠交易日历决定抓哪些天）。
    tushare: [instruments, calendar, daily, daily_basic, adj_factor, stk_limit, suspend_d, index_daily, fut_daily]
    # 顺序按「先小后大」：前两张每天只有几十到一千行，能最快验证凭证与权限；
    # 后三张是个股 × 日的大表，全量各约 216 万行。
    datayes: [factor_ret_cne6_sw21, factor_cov_cne6_sw21, exposure_cne6_sw21, srisk_cne6_sw21, specific_ret_cne6_sw21]
  ingest:
    yinhe: [calendar, symbol_map, instruments, bars_1d]
    ricequant: [instruments, calendar, bars_1d]
    insight: [instruments, calendar, bars_1d]
    # 可用的 importer（也可以直接写组名 reference / bars_1d / market_ext / all）：
    #   instruments, symbol_map, calendar,
    #   stock_bar_1d, index_bar_1d, future_bar_1d,
    #   daily_basic, adj_factor_ts, valuation_1d, instrument_category
    # 顺序有依赖：instruments -> symbol_map -> 其余全部（都要靠 symbol_map 解析
    # instrument_id）。
    #
    # 关于「切主源」：canonical 行情表理论上可能已被别的 provider 占有，此时
    # tushare 的 claim 会撞 OwnershipError，需走 `gr-data own release/set` 显式转移
    # 并做新旧源一致性比对。**先跑 `gr-data own list` 看清楚再决定**——
    # 空的归属表意味着首次 claim、零冲突，有存量数据的库则必须逐表评估。
    tushare: [reference, bars_1d, market_ext, fundamental, classify]
    # datayes 顺序有依赖：symbol_map 建立 secID → instrument_id 映射，
    # model_run 钉住因子集合与顺序，其余五张表都要靠它俩。
    # symbol_map 又依赖 tushare 先把 meta.instruments 建好。
    datayes: [meta, wide, cross, classify]
