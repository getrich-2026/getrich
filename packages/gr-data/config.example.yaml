# GetRich 数据接入层配置样例
# 复制为 config.yaml 并填入真实值（config.yaml 已被 .gitignore 忽略）。
#
# 这里只放**结构化的采集参数**：抓取范围、限频、启用哪些 fetcher/importer。
# 数据库连接与日志配置统一在仓库根的 .env（PG_HOST / PG_PASSWORD / LOG_LEVEL …），
# 不要在这里再写一份 —— 两份配置用的还是不同的环境变量名（PGHOST vs PG_HOST），
# 会让 CLI 和应用连到不同的库上。
# 凭证一律只写「环境变量名」，不写明文密钥。

# ---- 全局 ----
paths:
  # raw 层 parquet 落地根目录（仓库外）。
  raw_root: /opt/raw_parquet

# ---- 数据源 ----
providers:
  yinhe:
    # 银河 AmazingData，凭证从环境变量读取
    username_env: YINHE_USER
    password_env: YINHE_PASSWORD
    host: ${YINHE_HOST}
    port: 8600
    rate_limit:
      sleep_between_requests_sec: 1.5
      max_retries: 5
      retry_backoff_base_sec: 3.0
      sleep_between_fetchers_sec: 5.0
    start_date: null            # 可选全局下限，int8，如 20130101

  ricequant:
    # 变量名与 settings.py 的 RiceQuantConfig 保持一致；
    # 曾经这里写 RQ_LICENSE 而 settings 读 RICEQUANT_API_KEY，两套名字
    # 导致采集层拿不到 license，rqdatac.init() 静默退化成无凭证初始化。
    license_env: RICEQUANT_API_KEY   # 或改用 username_env/password_env
    username_env: null
    password_env: null
    market: cn

  insight:
    username_env: INSIGHT_USER
    password_env: INSIGHT_PASSWORD

  tushare:
    token_env: TUSHARE_TOKEN
    rate_limit:
      # Tushare 按积分分级限频，超限直接抛异常。1.5s 对应约 40 次/分钟，
      # 低积分账号需调大。
      sleep_between_requests_sec: 1.5
      max_retries: 5
      retry_backoff_base_sec: 3.0
    start_date: 20130101        # 全量起点，int8

# ---- 抓取/入库开关（哪些 fetcher / importer 启用）----
# 详见 docs/layers/*.md
enabled:
  raw:
    yinhe: [calendar, hist_code_list, backward_factor, kline_day, kline_min1]
    ricequant: [instruments, calendar, bars_1d]
    insight: [basic_info, trading_days, kline_day]
    tushare: [instruments, calendar, daily, adj_factor, stk_limit, suspend_d, index_daily, fut_daily]
  ingest:
    yinhe: [calendar, symbol_map, instruments, bars_1d]
    ricequant: [instruments, calendar, bars_1d]
    insight: [instruments, calendar, bars_1d]
    # Tushare 默认**不入库**。可用的 importer：
    #   instruments, symbol_map, calendar, stock_bar_1d, index_bar_1d, future_bar_1d
    # 这些目标表现由 yinhe 占有（见 reference/design/tushare/tushare_integration_plan.md §3.1），
    # 启用即等于「切主源」——是该方案里标为高风险的 P5 阶段，需逐表评估数据一致性、
    # 走 `getrich own release/set` 显式转移，并经人工确认。不要在这里随手打开。
    # 顺序有依赖：instruments -> symbol_map -> *_bar_1d
    tushare: []
