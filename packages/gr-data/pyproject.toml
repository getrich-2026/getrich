[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-data"
version = "0.1.2"
description = "GetRich 数据层：配置、数据库客户端，以及外部数据接入（raw → ingest → PostgreSQL/TimescaleDB，含 stream 实时层）"
requires-python = ">=3.11"
dependencies = [
    "gr-tools",
    "akshare",
    "clickhouse-connect",
    "duckdb",
    "httpx>=0.27",
    "pandas>=2.0",
    "polars",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "rich",
    "rqdatac",
    "tqdm",
    "tushare>=1.4",
]

# tushare 与 rqdatac（米筐）已列入主依赖，无需手动安装。
# 以下供应商 SDK 不在 PyPI / 需凭证与专用 wheel，按需手动安装：
#   yinhe: AmazingData    insight: insight_python（华泰 INSIGHT 已停用，代码保留）
[project.scripts]
gr-data = "gr_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gr_data*"]

[tool.setuptools.package-data]
gr_data = ["py.typed"]
