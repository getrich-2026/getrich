[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-backtest"
version = "0.1.2"
description = "GetRich 回测引擎：纯 Python 库，不含任何 Web / 实盘 / 调度代码"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "gr-data",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "polars",
    "psycopg[binary,pool]>=3.2",
    "pyarrow",
    "python-dateutil",
    "scipy",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gr_backtest*"]
