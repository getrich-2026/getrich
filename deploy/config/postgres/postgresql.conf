# PostgreSQL 配置定义（TimescaleDB 镜像）
#
# 通过 `postgres -c config_file=...` 加载。第一行先 include 回 $PGDATA/postgresql.conf，
# 保留镜像内 timescaledb-tune 按本机规格算出的内存与并行度调优；其后的设置覆盖它，
# 只管**与机器规格无关**的部分（时区、日志、WAL、planner、事务）。
#
# PostgreSQL 后读到的设置胜出，所以 include 必须放在最前面。
#
# 本文件是可复现的部署定义，同步模板时会被整体覆盖；部署实例的个性化参数用 ALTER SYSTEM（见「内存」一节）。
#
# 下面的数据目录路径带 PostgreSQL 大版本号（镜像 PGDATA=/var/lib/postgresql/<major>/docker），
# 升级大版本时必须与 docker-compose.yml 的镜像一起改。

# ---------- 路径 ----------
# config_file 位于 $PGDATA 之外时，下面三项必须显式指定，否则 PostgreSQL 无法推断
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# ---------- 继承 timescaledb-tune 的调优 ----------
# 提供 shared_buffers / effective_cache_size / work_mem / maintenance_work_mem /
# max_worker_processes / max_parallel_workers 等按本机内存核数算出的值，
# 以及 shared_preload_libraries = 'timescaledb'
include_if_exists = '/var/lib/postgresql/18/docker/postgresql.conf'

# ---------- 以下覆盖 include 的内容 ----------

# ---------- 连接 ----------
listen_addresses = '*'
port = 5432

# ---------- 扩展 ----------
# 兜底：include 缺失时仍保证 TimescaleDB 加载。
# pg_stat_statements 只在此预加载；视图需在库内执行一次
# CREATE EXTENSION IF NOT EXISTS pg_stat_statements（运维扩展，不进 gr-db DDL）
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.telemetry_level = off

# ---------- 时区与本地化（平台铁律：Asia/Shanghai）----------
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
# 日志消息保持英文以便 grep；C locale 在任何基础镜像上恒定可用
lc_messages = 'C'

# ---------- WAL 与 checkpoint ----------
wal_level = replica
wal_compression = on
# 批量 COPY 入库时 2GB 会频繁触发 checkpoint；这是磁盘占用上限，与内存无关
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ---------- 查询规划（SSD）----------
random_page_cost = 1.1

# ---------- 日志 ----------
logging_collector = on
log_directory = '/var/log/postgresql'
# 按星期命名 7 个文件：服务跨午夜按时间轮转时截断同名文件，长期运行下日志总量封顶。
# 启动时只追加不截断，若每天都在午夜前停机，当天文件会持续追加，需部署侧另行清理。
# 文件名若带日期／时分秒则永不重名，log_truncate_on_rotation 完全不起作用。
# 按大小轮转不会截断同名文件，所以关闭。
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
# 记录慢查询（超过 1s）
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
# 记录所有落盘的临时文件，便于发现 work_mem 不足
log_temp_files = 0
# 只记录耗时 10s 以上的 autovacuum；0 会在批量入库时刷屏
log_autovacuum_min_duration = 10s

# ---------- 事务 ----------
# 悬挂事务会一直持锁并阻塞 vacuum，10 分钟后强制中断
idle_in_transaction_session_timeout = 10min

# ---------- 内存 ----------
# 默认交给 timescaledb-tune（见上方 include），不在这里写死 —— 手写的保守值会覆盖掉
# 按本机规格算出的调优，导致 shared_buffers 等参数不升反降。
#
# 部署实例需要固定时用 ALTER SYSTEM（写入卷内 postgresql.auto.conf，优先级高于本文件，
# 且不会被模板同步覆盖），例如：
#   ALTER SYSTEM SET shared_buffers = '1GB';      -- 需重启
#   ALTER SYSTEM SET work_mem = '16MB';           -- SELECT pg_reload_conf() 即可
# 只有所有部署都应采用的值才写进本文件。
