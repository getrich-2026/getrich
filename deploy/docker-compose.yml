# GetRich 基础设施部署模板。
# 不要在 GetRich 仓库内直接启动；请把 deploy/ 中的文件复制到仓库外的部署目录根后再运行。
# Python 应用仍通过 uv workspace 在宿主机运行。
#
# 【铁律】三个数据库的数据目录一律用 named volume，绝不 bind mount 宿主机目录。
# 文件末尾 volumes: 固定卷名；日志目录可以继续 bind，方便宿主机直接查看。
#
# 默认只启动 PostgreSQL。ClickHouse / Redis 放在同名 profile 里，按需启用：
#   docker compose --profile clickhouse --profile redis up -d
# 或在 .env 设置 COMPOSE_PROFILES=clickhouse,redis。
name: ${COMPOSE_PROJECT_NAME:-getrich}
services:
  postgres:
    # 非 -oss 版（Timescale License）：压缩、保留策略、后台作业只在此版本可用。
    # -oss 版下 gr-db 的压缩／保留 DDL 会被 EXCEPTION 吞掉，迁移成功但功能缺失。
    image: timescale/timescaledb:2.30.1-pg18
    container_name: ${POSTGRES_CONTAINER_NAME:-getrich-pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:?Set PG_USER in .env}
      # 密码、initdb 参数、timescaledb-tune 只在数据目录首次初始化时生效，之后改这里无效
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:?Set PG_DB in .env}
      # builtin C.UTF-8：排序结果不依赖 libc，换镜像／系统不会让索引顺序失效；
      # 显式开启数据页校验和，及早发现存储层损坏
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --data-checksums"
      # 留空则按整个 Docker 虚拟机的内存／核数调优；与 CH／Redis 共用虚拟机时应显式限定
      TS_TUNE_MEMORY: ${PG_TUNE_MEMORY:-}
      TS_TUNE_NUM_CPUS: ${PG_TUNE_NUM_CPUS:-}
      # 留空时 tune 按内存推算（4GB 只给 50）；work_mem 按此连接数反推
      TS_TUNE_MAX_CONNS: ${PG_TUNE_MAX_CONNS:-}
      TZ: ${TZ:-Asia/Shanghai}
    # 全部参数见 config/postgres/postgresql.conf
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${PG_PORT:-5432}:5432"
    volumes:
      # PG18 起镜像的 PGDATA 是 /var/lib/postgresql/18/docker，卷挂在上一级，
      # 以后大版本升级可在同一卷内并存新旧数据目录（pg_upgrade --link）
      - pg_data:/var/lib/postgresql
      - ${POSTGRES_LOG_DIR:-./.docker/postgres/logs}:/var/log/postgresql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 1gb
    # 默认 10s 后 SIGKILL；shared_buffers 较大时关机 checkpoint 来不及完成，下次启动要走崩溃恢复
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quant_network

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.6.5
    profiles: ["clickhouse"]
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-getrich-ch26}
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?Set CLICKHOUSE_DB in .env}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123"
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${CLICKHOUSE_INTERSERVER_PORT:-9009}:9009"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ${CLICKHOUSE_LOG_DIR:-./.docker/clickhouse/logs}:/var/log/clickhouse-server
      - ./config/clickhouse/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --database "$$CLICKHOUSE_DB"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - quant_network

  redis:
    image: redis:8.10.1
    profiles: ["redis"]
    container_name: ${REDIS_CONTAINER_NAME:-getrich-redis82}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # 容量上限按机器规格调整；策略为 noeviction，写满即报错（见 config/redis/redis.conf）
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-2gb}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - /bin/sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY"
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ${REDIS_LOG_DIR:-./.docker/redis/logs}:/var/log/redis
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quant_network

networks:
  quant_network:
    name: ${DOCKER_NETWORK_NAME:-quant_network}
    driver: bridge

volumes:
  pg_data:
    name: ${POSTGRES_VOLUME_NAME:-getrich_pg_data}
  ch_data:
    name: ${CLICKHOUSE_VOLUME_NAME:-getrich_ch_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-getrich_redis_data}
