                  format: float
                  description: 实际执行价格
                  example: 3652.00
                executed_quantity:
                  type: integer
                  description: 实际执行数量
                  example: 1
                executed_at:
                  type: string
                  format: date-time
                  description: 执行时间（不传则取当前时间）
                note:
                  type: string
                  description: 执行备注
                  example: 按触发价入场，小幅滑点
            example:
