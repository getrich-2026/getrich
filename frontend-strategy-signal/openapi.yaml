                      symbol: IF2506
                      symbol_name: 沪深300股指期货2506
                      exchange: CFFEX
                      trigger_price: 3650.00
                      target_price: 3700.00
                      stop_loss_price: 3620.00
                      confidence: 0.85
                      urgency: high
                      reason: "IF 当月-次月价差偏离 2σ，触发均值回归开仓"
                      trigger_time: "2026-04-15T09:31:00+08:00"
                      is_read: false
                      is_executed: false
                      status: active
                  pagination:
