                      paid_at: "2026-04-15T10:02:30+08:00"
                      items:
                        - item_type: strategy_subscription
                          item_id: STR_FUT_001
                          item_name: 股指期货跨期套利（年订阅）
                          plan_type: yearly
                          amount: 899.00
                  pagination:
                    page: 1
                    page_size: 20
                    total: 5
                    total_pages: 1
                    has_more: false
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ====================================================
  # 支付回调（Webhook）
  # ====================================================

  /webhooks/payment:
    post:
      tags: [支付回调]
      summary: 支付结果回调
      description: |
        由支付平台（微信/支付宝/银行）异步回调。
        - 以 payment_ref 去重（幂等），重复回调直接返回 200。
        - 验签：HMAC-SHA256（Header: X-Webhook-Signature）。
        - 成功后：orders.status=paid，user_strategy_subscriptions.status=active，失效 Redis 权限缓存。
      operationId: paymentWebhook
      security:
        - {}
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 签名（Hex 编码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, payment_ref, status, amount, payment_source]
              properties:
                order_id:
                  type: string
                  description: 系统订单 ID
                  example: ORD_20260415_001
                payment_ref:
                  type: string
                  description: 第三方支付流水号（幂等键）
                  example: "4200001234202604151234567890"
                status:
                  type: string
                  enum: [success, failed, refunded]
                  description: 支付结果
                amount:
                  type: number
                  format: float
                  description: 实际支付金额
                  example: 899.00
                payment_source:
                  type: string
                  enum: [wechat, alipay, bank, apple_pay, stripe]
                paid_at:
                  type: string
                  format: date-time
                  description: 支付完成时间
            example:
              order_id: ORD_20260415_001
              payment_ref: "4200001234202604151234567890"
              status: success
              amount: 899.00
              payment_source: wechat
              paid_at: "2026-04-15T10:02:30+08:00"
      responses:
        "200":
          description: 回调处理成功（含幂等重复回调）
          content:
            application/json:
              example:
                code: 0
                message: success
                data:
                  order_id: ORD_20260415_001
                  processed: true

# ====================================================
# Tags 分组
# ====================================================
tags:
  - name: 策略模块
    description: 策略列表、详情、时序数据
  - name: 策略模块 - 订阅
    description: 订阅 / 取消订阅 / 订阅状态查询
  - name: 策略模块 - 推送设置
    description: 策略维度的推送通知配置
  - name: 信号模块
    description: 信号流、详情、已读、执行反馈
  - name: 用户模块
    description: 用户全局推送设置、订单列表
  - name: 支付回调
    description: 第三方支付异步回调（Webhook）
