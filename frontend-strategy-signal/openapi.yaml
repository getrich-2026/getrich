  /user/orders:
    get:
      tags: [用户模块]
      summary: 获取用户订单列表
      description: 分页返回当前用户的全部订单，含订单行项目。
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, cancelled, refunded, all]
