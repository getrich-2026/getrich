  /signals/{signal_id}/execute:
    post:
      tags: [信号模块]
      summary: 记录信号执行反馈
      description: |
        INSERT ... ON CONFLICT DO UPDATE（幂等，可多次更新）。
        自动计算滑点（executed_price - trigger_price）。
      operationId: executeSignal
      parameters:
        - $ref: '#/components/parameters/SignalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                executed_price:
