    get:
      tags: [信号模块]
      summary: 获取未读信号统计
      description: |
        返回当前用户的未读信号汇总：总数 + 按策略分组 + 按紧急度分组。
        结果 Redis 缓存 60s。
      operationId: getUnreadSummary
