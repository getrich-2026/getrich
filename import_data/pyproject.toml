[project]
name = "import-data"
version = "0.1.0"
description = "Data ingestion and normalization for getrich ecosystem"
authors = [
    { name = "quant", email = "quant@getrich.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "clickhouse-connect>=0.7.0",
    "psycopg[binary,pool]>=3.2.0",
    "akshare",
    "rqdatac",
    "python-dotenv",
    "polars>=1.40.1",
    "redis[hiredis]>=5.0.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.14",
]

