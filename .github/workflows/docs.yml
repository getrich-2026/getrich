name: Docs

# 触发：docs 配置 / 源码 / 设计契约变更
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/getrich_backtest/**"
      - "backtest/docs/**"
  push:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/getrich_backtest/**"
      - "backtest/docs/**"

# 同一 PR 多次推送只保留最新一个 run
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mkdocs site (--strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史，git-revision-date-localized 插件需要

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: docs-uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            docs-uv-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Install mkdocs + plugins
        run: |
          uv add --dev \
            mkdocs-material \
            mkdocstrings-python \
            mkdocs-include-markdown-plugin \
            "pymdown-extensions>=10" \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin \
            mkdocs-autorefs \
            griffe-inherited-docstrings

      # 严格 build：任何 warning 即失败（CI 友好）
      - name: Build docs (strict)
        run: uv run mkdocs build --strict --clean

      # 把构建产物作为 artifact 上传
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
          if-no-files-found: error

  # 可选：main 分支合并后部署到 gh-pages
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Round #1156: bump from v3 to v5.
      # v4 (Sep 2024) changed the default to exclude hidden files —
      # mkdocs build output has none, so this is safe. v5 (Apr 2026)
      # tracks upload-artifact@v7 and adds include-hidden-files.
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      # Round #1156: bump from v4 to v5. v5 (Mar 2026) updates Node
      # runtime to 24.x (was 20.x in v4) and ships the immutable
      # action package workflow. No behavioral change for our
      # site/ artifact path.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
