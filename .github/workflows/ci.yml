name: CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      extra_services:
        description: "启用 ClickHouse 和 Redis 集成环境"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  UV_VERSION: "0.12.3"

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            packages/*/pyproject.toml
          cache-suffix: quality

      - name: Install Python
        run: uv python install ${{ env.UV_PYTHON }}

      - name: Install workspace
        run: uv sync --locked --all-packages

      # 2026-08-16 起 Ruff 已清零（此前有 362 个既有问题），因此去掉
      # continue-on-error，让新引入的问题真正阻塞 CI。
      # 测试代码在各包的 packages/*/tests 下，没有顶层 tests 目录。
      - name: Ruff lint
        run: uv run --frozen ruff check packages scripts

      - name: Ruff format
        run: uv run --frozen ruff format --check packages scripts

      - name: Migration topology lint
        run: uv run --frozen python scripts/lint_migrations.py --db all

      - name: Migration comment coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          # push 不能与已更新到当前提交的 origin/dev 比较，否则检查永远为空。
          # 新分支的 before 为全零；手动运行与新分支均检查最后一次提交。
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF='HEAD^'
          fi
          git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null
          uv run --frozen python scripts/lint_migrations.py --db pg --comments \
            --base-ref "$BASE_REF"

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            coverage: false
          - python-version: "3.12"
            coverage: true

    services:
      postgres:
        image: timescale/timescaledb:2.28.3-pg17-oss
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: getrich
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: ${{ inputs.extra_services && matrix.coverage && 'clickhouse/clickhouse-server:26.3' || '' }}
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: ${{ inputs.extra_services && matrix.coverage && 'redis:8.2.8' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # uv 默认读取根 .python-version；只安装解释器不会切换测试版本。
      UV_PYTHON: ${{ matrix.python-version }}
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: quant
      PG_PASSWORD: testpass
      PG_DB: getrich
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: default
      CLICKHOUSE_PROTOCOL: http
      GETRICH_WORKER_BACKEND: ${{ inputs.extra_services && matrix.coverage && 'celery' || 'inproc' }}
      GETRICH_BROKER_URL: redis://localhost:6379/0
      GETRICH_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            packages/*/pyproject.toml
          cache-suffix: py${{ matrix.python-version }}

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Apply PostgreSQL migrations
        run: uv run --frozen gr-db migrate --target pg

      - name: Apply ClickHouse migrations
        if: inputs.extra_services && matrix.coverage
        run: uv run --frozen gr-db migrate --target ch

      - name: Data dictionary smoke
        if: matrix.coverage
        run: uv run --frozen gr-db docs --target ${{ inputs.extra_services && 'all' || 'pg' }} --out /tmp/dd.html --fail-on-drift

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run --frozen pytest

      - name: Run tests with coverage
        if: matrix.coverage
        env:
          # 在 CI 的临时数据库中启用选股与持仓诊断的端到端测试。
          GETRICH_TEST_PG: "1"
        run: |
          uv run --frozen pytest --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage XML
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage.xml
          retention-days: 3
          if-no-files-found: warn
